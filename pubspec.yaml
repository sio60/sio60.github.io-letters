name: jhjhjhjh
description: "66일 동안 하루에 한 장씩 열리는 편지."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/chiikawa-official-artwork.webp
    - assets/chiikawa-face-official.png
    - assets/hachiware-face-official.png
    - assets/usagi-face-official.png
    - assets/ode-face-user.png
    - assets/goblin-face-official.png
