<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="">
  <meta name="theme-color" content="#FFFFFF">

  <!-- 카카오톡·메시지로 링크를 보냈을 때 보이는 미리보기 -->
  <meta property="og:title" content="편지">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="편지">
  <link rel="apple-touch-icon" href="icons/letter-icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/letter-icon.svg"/>

  <title>편지</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; background: #FFFFFF; }
    /* 플러터 엔진이 뜨기 전까지 보이는 화면. */
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", sans-serif;
      color: #777777; font-size: 12px; letter-spacing: .2px;
      transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .seal {
      width: 108px; height: 108px;
      margin-bottom: 4px; animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #loading .seal { animation: none; } }
  </style>
</head>
<body>
  <div id="loading"><img class="seal" src="icons/letter-icon.svg" alt="">편지 여는 중</div>

  <script>
    // 플러터 뷰가 DOM 에 붙는 순간 로딩 화면을 걷어냅니다.
    const observer = new MutationObserver(function () {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        const el = document.getElementById('loading');
        if (el) {
          el.classList.add('hidden');
          setTimeout(function () { el.remove(); }, 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
