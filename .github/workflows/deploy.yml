name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 편지 원고가 바뀌었는데 생성 파일을 커밋 안 했어도 배포본은 항상 최신이 되게 합니다.
      - run: dart run tool/build_letters.dart

      - run: flutter test

      # GitHub Pages 는 https://<user>.github.io/<repo>/ 로 서빙되므로 base-href 가 필요합니다.
      - run: flutter build web --release --base-href /sio60.github.io-letters/

      # 이전 앱 파일이 브라우저에 남아도 새 배포의 실행 파일을 불러옵니다.
      - run: dart run tool/stamp_web_build.dart "${{ github.sha }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
